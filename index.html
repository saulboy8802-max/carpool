<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>章毅结婚拼车 · 共享版</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#1f2937}.wrap{max-width:760px;margin:auto;padding:16px 12px 36px}.header{background:#111827;color:#fff;border-radius:18px;padding:22px;margin-bottom:14px}.header-row{display:flex;justify-content:space-between;gap:12px}.header h1{margin:0 0 6px;font-size:25px}.header p{margin:0;color:#d1d5db;font-size:14px}.sync{font-size:12px;color:#d1d5db}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px rgba(15,23,42,.06)}.title{margin:0 0 14px;font-size:18px;font-weight:750}.field{margin-bottom:13px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:650}input,select{width:100%;padding:12px 13px;border:1px solid #d9e0ea;border-radius:11px;font-size:16px;background:#fff;outline:none}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:#111827;color:#fff}.light{background:#eef2f7;color:#111827}.danger{background:#fee2e2;color:#991b1b}.outline{background:#fff;color:#111827;border:1px solid #d8dee9}.mode.active{background:#111827;color:#fff}.mode:not(.active){background:#eef2f7;color:#111827}.hidden{display:none!important}.hint{color:#6b7280;font-size:13px;line-height:1.55}.status{display:none;margin-top:12px;border-radius:11px;padding:11px 12px;font-size:14px}.status.show{display:block}.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.rides{display:grid;gap:12px}.ride{border:1px solid #e3e8ef;border-radius:14px;padding:15px}.ride-top{display:flex;justify-content:space-between;gap:12px}.ride-name{font-size:17px;font-weight:750}.meta{color:#6b7280;font-size:13px;margin-top:4px}.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.open{background:#ecfdf5;color:#047857}.full{background:#f3f4f6;color:#6b7280}.members{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.member{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:13px}.member.driver{background:#e0e7ff;color:#3730a3}.progress{height:8px;border-radius:999px;overflow:hidden;background:#edf1f5;margin:8px 0 4px}.bar{height:100%;background:#111827}.ride-action{margin-top:12px}.ride-action button{width:100%}.waiting{display:flex;flex-wrap:wrap;gap:8px}.waiting span{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:7px 10px;border-radius:999px;font-size:13px}.empty{text-align:center;color:#9ca3af;padding:24px 8px;font-size:14px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.small{padding:9px 11px;font-size:13px}.setup{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px}@media(max-width:560px){.wrap{padding:10px 9px 28px}.card,.header{border-radius:14px}.header h1{font-size:22px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="header-row"><div><h1>章毅结婚拼车</h1><p>司机建车队，乘客直接加入。不同手机共享同一份数据。</p></div><div id="syncText" class="sync">未连接</div></div></div>
  <div id="setupTip" class="setup hidden">尚未配置 Supabase。请在 HTML 底部 CONFIG 区域填入 Project URL 和 Publishable Key。</div>

  <div class="card">
    <div class="title">1. 我的拼车</div>
    <div class="field"><label for="nameInput">你的名字</label><input id="nameInput" maxlength="20" placeholder="例如：张三"></div>
    <div class="modes"><button id="driverTab" class="mode active" type="button">我是司机</button><button id="passengerTab" class="mode" type="button">我要搭车</button></div>
    <div id="driverForm" style="margin-top:16px">
      <div class="field"><label for="placeInput">集合地点</label><input id="placeInput" maxlength="50" placeholder="例如：园区东门"></div>
      <div class="field"><label for="timeInput">出发时间</label><input id="timeInput" type="time"></div>
      <div class="field"><label for="capacityInput">最多几个人（含司机）</label><select id="capacityInput"><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option><option value="6">6 人</option><option value="7">7 人</option></select></div>
      <button id="createBtn" class="primary" type="button" style="width:100%">创建我的车队</button>
    </div>
    <div id="passengerForm" class="hidden" style="margin-top:16px"><div class="hint">先登记为搭车人，再从下方选择一辆车加入。</div><button id="passengerBtn" class="primary" type="button" style="width:100%;margin-top:12px">我需要搭车</button></div>
    <div id="status" class="status"></div>
  </div>

  <div class="card"><div class="title">2. 当前车队</div><div class="toolbar"><button id="refreshBtn" class="outline small" type="button">刷新</button></div><div id="rideList" class="rides"></div></div>
  <div class="card"><div class="title">3. 还没上车的人</div><div id="waitingList" class="waiting"></div><div id="waitingEmpty" class="empty">目前没有待拼车的人</div></div>
  <div class="card"><div class="title">说明</div><div class="hint">页面每 5 秒自动同步一次。为保持简单，本版只保存姓名、集合地点、时间和车队关系。</div></div>
</div>

<script>
const SUPABASE_URL = "https://hnlryvgmkqeitqwrxhkw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_exMuvKMuxePrYyznnOM0tg_9W52ql2n";
const EVENT_ID = "activity-2026-10-demo";

const configured=!SUPABASE_URL.startsWith("PASTE_")&&!SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_");
const sb=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let authUser=null,mode="driver",rides=[],participants=[],loading=false;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function friendly(e){const r=String(e?.message||e||"");for(const [k,t] of [["RIDE_FULL","这辆车刚刚已经满员。"],["ALREADY_IN_RIDE","你已经在一辆车里，请先退出。"],["DRIVER_CANNOT_JOIN","司机不能加入其他车队。"],["DRIVER_HAS_RIDE","你已经创建了车队。"],["REGISTER_FIRST","请先登记为搭车人。"],["NOT_PASSENGER","当前身份不是搭车人。"],["NOT_DRIVER","只有司机本人可以解散车队。"],["RIDE_NOT_FOUND","车队不存在或已被解散。"],["INVALID_CAPACITY","人数设置不正确。"],["INVALID_NAME","请填写姓名。"],["INVALID_PLACE","请填写集合地点。"],["AUTH_REQUIRED","匿名登录失败，请刷新页面重试。"]])if(r.includes(k))return t;return r||"操作失败，请重试。"}
function status(t,ok=true){$("status").textContent=t;$("status").className="status show "+(ok?"ok":"err")}
function clearStatus(){$("status").className="status";$("status").textContent=""}
function switchMode(n){mode=n;$("driverTab").classList.toggle("active",n==="driver");$("passengerTab").classList.toggle("active",n==="passenger");$("driverForm").classList.toggle("hidden",n!=="driver");$("passengerForm").classList.toggle("hidden",n!=="passenger");clearStatus()}
async function ensureAuth(){const {data:s}=await sb.auth.getSession();if(s?.session?.user){authUser=s.session.user;return}const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;authUser=data.user}
async function loadData(silent=false){if(!configured||loading)return;loading=true;if(!silent)$("syncText").textContent="同步中…";try{const [a,b]=await Promise.all([sb.from("rides").select("id,event_id,driver_user_id,place,departure_time,capacity,created_at").eq("event_id",EVENT_ID).order("created_at"),sb.from("participants").select("event_id,user_id,name,role,ride_id,updated_at").eq("event_id",EVENT_ID).order("updated_at")]);if(a.error)throw a.error;if(b.error)throw b.error;rides=a.data||[];participants=b.data||[];const me=participants.find(p=>p.user_id===authUser?.id);if(me?.name){$("nameInput").value=me.name;localStorage.setItem("carpool_name",me.name)}render();$("syncText").textContent="已同步"}catch(e){$("syncText").textContent="同步失败";if(!silent)status(friendly(e),false)}finally{loading=false}}
function render(){const me=participants.find(p=>p.user_id===authUser?.id)||null;const list=$("rideList");list.innerHTML="";if(!rides.length)list.innerHTML='<div class="empty">还没有司机创建车队</div>';for(const ride of rides){const driver=participants.find(p=>p.user_id===ride.driver_user_id&&p.ride_id===ride.id);const members=participants.filter(p=>p.ride_id===ride.id);const used=members.length,full=used>=ride.capacity,percent=Math.min(100,Math.round(used/ride.capacity*100));const mh=members.map(m=>`<span class="member ${m.user_id===ride.driver_user_id?"driver":""}">${esc(m.name)}${m.user_id===ride.driver_user_id?" · 司机":""}</span>`).join("");let action="";const mine=me?.ride_id===ride.id,amDriver=ride.driver_user_id===authUser?.id;if(amDriver)action=`<button class="danger" onclick="dissolveRide('${ride.id}')">解散车队</button>`;else if(mine)action=`<button class="outline" onclick="leaveRide()">退出这辆车</button>`;else if(me?.ride_id)action=`<button class="light" disabled>你已加入其他车队</button>`;else if(me?.role==="passenger")action=full?`<button class="light" disabled>已满员</button>`:`<button class="primary" onclick="joinRide('${ride.id}')">加入这辆车</button>`;else action=`<button class="light" disabled>请先选择“我要搭车”</button>`;const d=document.createElement("div");d.className="ride";d.innerHTML=`<div class="ride-top"><div><div class="ride-name">${esc(driver?.name||"司机")}的车</div><div class="meta">${esc(ride.place)} · ${esc(String(ride.departure_time).slice(0,5))}</div></div><span class="badge ${full?"full":"open"}">${full?"已满":"可加入"}</span></div><div class="members">${mh}</div><div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="meta">${used} / ${ride.capacity} 人 · 剩余 ${Math.max(0,ride.capacity-used)} 个位置</div><div class="ride-action">${action}</div>`;list.appendChild(d)}const waiting=participants.filter(p=>p.role==="passenger"&&!p.ride_id);$("waitingList").innerHTML="";$("waitingEmpty").classList.toggle("hidden",waiting.length>0);for(const p of waiting){const s=document.createElement("span");s.textContent=p.name;$("waitingList").appendChild(s)}}
async function createRide(){const name=$("nameInput").value.trim(),place=$("placeInput").value.trim(),time=$("timeInput").value,capacity=Number($("capacityInput").value);if(!name||!place||!time){status("请填写姓名、集合地点和出发时间。",false);return}localStorage.setItem("carpool_name",name);const {error}=await sb.rpc("create_ride",{p_event_id:EVENT_ID,p_name:name,p_place:place,p_departure_time:time,p_capacity:capacity});if(error){status(friendly(error),false);return}status("车队已创建，其他人现在可以加入。");await loadData(true)}
async function registerPassenger(){const name=$("nameInput").value.trim();if(!name){status("请先填写姓名。",false);return}localStorage.setItem("carpool_name",name);const {error}=await sb.rpc("register_passenger",{p_event_id:EVENT_ID,p_name:name});if(error){status(friendly(error),false);return}status("已登记为搭车人，请从下方选择一辆车。");await loadData(true)}
async function joinRide(id){const name=$("nameInput").value.trim();if(!name){status("请先填写姓名。",false);return}const {error}=await sb.rpc("join_ride",{p_event_id:EVENT_ID,p_ride_id:id,p_name:name});if(error){status(friendly(error),false);await loadData(true);return}status("加入成功，你们已经搭成一伙了。");await loadData(true)}
async function leaveRide(){const {error}=await sb.rpc("leave_ride",{p_event_id:EVENT_ID});if(error){status(friendly(error),false);return}status("你已退出车队，现在重新进入待拼车。");await loadData(true)}
async function dissolveRide(id){if(!confirm("确定解散这个车队吗？原乘客会回到‘还没上车的人’。"))return;const {error}=await sb.rpc("dissolve_ride",{p_event_id:EVENT_ID,p_ride_id:id});if(error){status(friendly(error),false);return}status("车队已解散。");await loadData(true)}
async function boot(){if(!configured){$("setupTip").classList.remove("hidden");$("syncText").textContent="待配置";document.querySelectorAll("button").forEach(b=>{if(!["driverTab","passengerTab"].includes(b.id))b.disabled=true});return}try{$("syncText").textContent="连接中…";await ensureAuth();const n=localStorage.getItem("carpool_name");if(n)$("nameInput").value=n;await loadData(true);$("syncText").textContent="已连接";setInterval(()=>loadData(true),5000)}catch(e){$("syncText").textContent="连接失败";status("连接 Supabase 失败。请确认已启用 Anonymous Sign-Ins，并检查 URL / Publishable Key。详情："+friendly(e),false)}}
$("driverTab").onclick=()=>switchMode("driver");$("passengerTab").onclick=()=>switchMode("passenger");$("createBtn").onclick=createRide;$("passengerBtn").onclick=registerPassenger;$("refreshBtn").onclick=()=>loadData(false);boot();
</script>
</body>
</html>
